<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Notiva Android app project cover</title><desc id="desc">A voice notes app project cover for Notiva.</desc>
